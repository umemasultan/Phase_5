name: Deploy Todo App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        if [ -f recurring-service/requirements.txt ]; then pip install -r recurring-service/requirements.txt; fi
        if [ -f notification-service/requirements.txt ]; then pip install -r notification-service/requirements.txt; fi
        if [ -f audit-service/requirements.txt ]; then pip install -r audit-service/requirements.txt; fi
        if [ -f websocket-service/requirements.txt ]; then pip install -r websocket-service/requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-and-push-backend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend

    - name: Build and push backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.backend
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

  build-and-push-recurring:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for recurring
      id: meta-recurring
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-recurring

    - name: Build and push recurring
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.recurring
        push: true
        tags: ${{ steps.meta-recurring.outputs.tags }}
        labels: ${{ steps.meta-recurring.outputs.labels }}

  build-and-push-notification:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for notification
      id: meta-notification
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-notification

    - name: Build and push notification
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.notification
        push: true
        tags: ${{ steps.meta-notification.outputs.tags }}
        labels: ${{ steps.meta-notification.outputs.labels }}

  build-and-push-audit:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for audit
      id: meta-audit
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-audit

    - name: Build and push audit
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.audit
        push: true
        tags: ${{ steps.meta-audit.outputs.tags }}
        labels: ${{ steps.meta-audit.outputs.labels }}

  build-and-push-websocket:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for websocket
      id: meta-websocket
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-websocket

    - name: Build and push websocket
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.websocket
        push: true
        tags: ${{ steps.meta-websocket.outputs.tags }}
        labels: ${{ steps.meta-websocket.outputs.labels }}

  build-and-push-frontend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend

    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    needs: [build-and-push-backend, build-and-push-recurring, build-and-push-notification, build-and-push-audit, build-and-push-websocket, build-and-push-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Configure Azure credentials
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
        cluster-name: ${{ secrets.AZURE_CLUSTER_NAME }}

    - name: Deploy to Kubernetes
      run: |
        # Install Dapr if not present
        helm repo add dapr https://dapr.github.io/helm-charts/
        helm repo update
        helm upgrade --install dapr dapr/dapr \
          --version=1.13 \
          --namespace dapr-system \
          --create-namespace \
          --wait || echo "Dapr already installed"

        # Create namespaces
        kubectl create namespace todo-prod --dry-run=client -o yaml | kubectl apply -f -
        kubectl create namespace kafka --dry-run=client -o yaml | kubectl apply -f -

        # Deploy Strimzi Kafka Operator
        kubectl create -f 'https://strimzi.io/install/latest?namespace=kafka' -n kafka || echo "Strimzi already installed"

        # Wait for Strimzi operator
        kubectl wait --for=condition=ready pod -l name=strimzi-cluster-operator -n kafka --timeout=300s

        # Deploy Kafka cluster
        helm upgrade --install kafka charts/kafka \
          --namespace kafka \
          --wait --timeout 10m

        # Wait for Kafka to be ready
        kubectl wait kafka/todo-kafka --for=condition=Ready --timeout=300s -n kafka

        # Deploy Dapr components
        helm upgrade --install dapr-components charts/dapr-components \
          --namespace todo-prod \
          --wait

        # Deploy PostgreSQL
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm upgrade --install postgresql bitnami/postgresql \
          --namespace todo-prod \
          --set auth.postgresPassword=${{ secrets.POSTGRES_PASSWORD }} \
          --set auth.database=tododb \
          --wait --timeout 10m

        # Deploy application with image tags
        helm upgrade --install todo-app charts/todo-app \
          --namespace todo-prod \
          --set backend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend \
          --set backend.image.tag=${{ github.sha }} \
          --set frontend.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend \
          --set frontend.image.tag=${{ github.sha }} \
          --set recurring.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-recurring \
          --set recurring.image.tag=${{ github.sha }} \
          --set notification.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-notification \
          --set notification.image.tag=${{ github.sha }} \
          --set audit.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-audit \
          --set audit.image.tag=${{ github.sha }} \
          --set websocket.image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-websocket \
          --set websocket.image.tag=${{ github.sha }} \
          --wait --timeout 10m

        # Get service URLs
        echo "✅ Deployment completed successfully"
        echo "Frontend URL:"
        kubectl get service frontend -n todo-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
        echo ""
        echo "Backend URL:"
        kubectl get service backend -n todo-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}'