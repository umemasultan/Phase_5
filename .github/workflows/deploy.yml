        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for websocket
      id: meta-websocket
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-websocket

    - name: Build and push websocket
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.websocket
        push: true
        tags: ${{ steps.meta-websocket.outputs.tags }}
        labels: ${{ steps.meta-websocket.outputs.labels }}

  build-and-push-frontend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend

    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.frontend
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy:
    needs: [build-and-push-backend, build-and-push-recurring, build-and-push-notification, build-and-push-audit, build-and-push-websocket, build-and-push-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    - name: Deploy to Kubernetes
      run: |
        # This would typically involve setting up kubectl credentials
        # and running helm upgrade commands
        echo "Deployment script would go here"
        # Example:
        # helm upgrade --install todo-app charts/todo-app --set image.tag=${{ github.sha }}