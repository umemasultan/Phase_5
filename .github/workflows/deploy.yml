name: Deploy Todo App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
        if [ -f recurring-service/requirements.txt ]; then pip install -r recurring-service/requirements.txt; fi
        if [ -f notification-service/requirements.txt ]; then pip install -r notification-service/requirements.txt; fi
        if [ -f audit-service/requirements.txt ]; then pip install -r audit-service/requirements.txt; fi
        if [ -f websocket-service/requirements.txt ]; then pip install -r websocket-service/requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-and-push-backend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend

    - name: Build and push backend
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.backend
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

  build-and-push-recurring:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for recurring
      id: meta-recurring
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-recurring

    - name: Build and push recurring
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.recurring
        push: true
        tags: ${{ steps.meta-recurring.outputs.tags }}
        labels: ${{ steps.meta-recurring.outputs.labels }}

  build-and-push-notification:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for notification
      id: meta-notification
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-notification

    - name: Build and push notification
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.notification
        push: true
        tags: ${{ steps.meta-notification.outputs.tags }}
        labels: ${{ steps.meta-notification.outputs.labels }}

  build-and-push-audit:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for audit
      id: meta-audit
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-audit

    - name: Build and push audit
      uses: docker/build-push-action@v4
      with:
        context: .
        file: Dockerfile.audit
        push: true
        tags: ${{ steps.meta-audit.outputs.tags }}
        labels: ${{ steps.meta-audit.outputs.labels }}

  build-and-push-websocket:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
