version: '3.8'

services:
  # Kafka and Zookeeper for event streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # PostgreSQL database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dapr-secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001-advanced-features.sql:/docker-entrypoint-initdb.d/init.sql

  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - postgres
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DAPR_SIDECAR_HOST=dapr-sidecar
      - DAPR_SIDECAR_PORT=3500
    volumes:
      - ./backend/src:/app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Recurring task service
  recurring:
    build:
      context: .
      dockerfile: Dockerfile.recurring
    ports:
      - "8001:8001"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DAPR_SIDECAR_HOST=dapr-sidecar
      - DAPR_SIDECAR_PORT=3500
    volumes:
      - ./recurring-service/src:/app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  # Notification service
  notification:
    build:
      context: .
      dockerfile: Dockerfile.notification
    ports:
      - "8002:8002"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DAPR_SIDECAR_HOST=dapr-sidecar
      - DAPR_SIDECAR_PORT=3500
    volumes:
      - ./notification-service/src:/app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8002 --reload

  # Audit service
  audit:
    build:
      context: .
      dockerfile: Dockerfile.audit
    ports:
      - "8003:8003"
    depends_on:
      - kafka
      - postgres
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DAPR_SIDECAR_HOST=dapr-sidecar
      - DAPR_SIDECAR_PORT=3500
    volumes:
      - ./audit-service/src:/app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8003 --reload

  # WebSocket service
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.websocket
    ports:
      - "8004:8004"
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKERS=kafka:9092
      - DAPR_SIDECAR_HOST=dapr-sidecar
      - DAPR_SIDECAR_PORT=3500
    volumes:
      - ./websocket-service/src:/app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8004 --reload

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - DAPR_SIDECAR_HOST=dapr-sidecar
      - DAPR_SIDECAR_PORT=3500
    volumes:
      - ./frontend:/app

volumes:
  postgres_data: