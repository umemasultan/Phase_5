# AKS Deployment Configuration
# This file contains the configuration for deploying the Todo App on Azure Kubernetes Service

---
# Azure-specific configurations
apiVersion: v1
kind: Secret
metadata:
  name: azure-aks-todo-secrets
  namespace: todo-prod
type: Opaque
data:
  # Base64 encoded values
  database-url: <base64-encoded-db-url>
  kafka-connection: <base64-encoded-kafka-url>
  dapr-secret: <base64-encoded-dapr-secret>

---
# Azure Load Balancer for frontend
apiVersion: v1
kind: Service
metadata:
  name: frontend-aks-lb
  namespace: todo-prod
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-resource-group: <AKS-RESOURCE-GROUP>
spec:
  type: LoadBalancer
  loadBalancerIP: <STATIC-IP-IF-NEEDED>
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: frontend

---
# Azure-specific resource limits
apiVersion: v1
kind: LimitRange
metadata:
  name: azure-resource-limits
  namespace: todo-prod
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 200m
      memory: 256Mi
    type: Container

---
# Azure Files for persistent storage (if needed)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: aks-pv
  namespace: todo-prod
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteMany
  azureFile:
    secretName: azure-aks-todo-secrets
    shareName: todostorage
    readOnly: false
  mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - uid=1000
  - gid=1000
  - mfsymlinks
  - nobrl